# Game Studio Teen as a snap, built from source: installs the desktop shell and packs
# release/linux-unpacked. The shell serves this repository's static files, the same ones
# GitHub Pages publishes. The Snap Store's Builds tab builds and releases it to edge on
# every push to main; .github/workflows/snap.yml builds the same file and smoke-tests it.
#
# The store banner is not part of the snap. snap/gui is only the desktop entry and the icon,
# which snapcraft copies to meta/gui. Upload snap/store/banner.jpg in the listing media and
# keep the name banner.jpg: 3:1, from 720×240 to 4320×1440, at most 2 MB.
# snap/store/banner.png is the same picture; upload the jpg. Screenshots stay in
# docs/screenshots; the store does not read them from the repository.
name: gamestudio-teens
title: Game Studio Teen
base: core22
adopt-info: gamestudio-teens
icon: snap/gui/icon.png
summary: Draw the actors. Write the rules. Ship the game.
description: |
  A 2D game maker for readers aged about ten to fifteen, for tablets and
  computers. Every character, item and block is an actor with its own pixel
  art and its own rules. Start from a template, draw the actors, write the
  rules, paint the levels and test them with a debugger. Export the finished
  game as a single HTML file. The interface is in Brazilian Portuguese.
  Projects stay on this computer. No account is needed.
license: AGPL-3.0-or-later
website: https://gamestudio42.github.io/gamestudio-teens/
source-code: https://github.com/gamestudio42/gamestudio-teens
issues: https://github.com/gamestudio42/gamestudio-teens/issues
contact: talkgamestudio42@gmail.com
grade: stable
confinement: strict
compression: lzo

architectures:
  - build-on: amd64

apps:
  gamestudio-teens:
    # Chromium's own sandbox cannot run inside strict confinement; the snap sandbox replaces it.
    command: app/gamestudio-teens --no-sandbox
    desktop: meta/gui/gamestudio-teens.desktop
    extensions: [gnome]
    plugs:
      - browser-support
      - opengl
      - audio-playback
    environment:
      TMPDIR: $XDG_RUNTIME_DIR

parts:
  gamestudio-teens:
    plugin: nil
    source: .
    build-snaps:
      - node/22/stable
    stage-packages:
      - libnspr4
      - libnss3
      - libxss1
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' desktop/package.json)"
    override-build: |
      npm ci --prefix desktop
      npm run dist:dir --prefix desktop
      mkdir -p "$CRAFT_PART_INSTALL/app"
      cp -a desktop/release/linux-unpacked/. "$CRAFT_PART_INSTALL/app/"
